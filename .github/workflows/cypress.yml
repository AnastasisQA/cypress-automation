name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        default: "smoke"
        type: choice
        options: [smoke, regression, api, all]

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          # Smoke on every push/PR; chosen suite on manual runs
          command: >-
            npm run ${{ (github.event.inputs.suite == 'all' && 'cy:run')
            || (github.event.inputs.suite && format('cy:run:{0}', github.event.inputs.suite))
            || 'cy:run:smoke' }}
          # start: npm start
          # wait-on: "http://localhost:3000"
          # record: true   # enable with Cypress Cloud
        # env:
        #   CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
